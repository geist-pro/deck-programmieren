lecture:
  id: gdp-vl02-2
  deck: "VL 02.2 Zahlen & Objekte"
  header: "GdP · VL 2.2 Zahlen & Objekte"
  lang: de
  support: |
    class Gast {
        String name;
        int geburtsjahr;
        boolean stammgast;
        Gast(String name, int geburtsjahr) {
            this.name = name;
            this.geburtsjahr = geburtsjahr;
        }
    }
cards:
  # ---------------------------------------------------------------- Rechnen mit Typen
  - id: gdp-vl02-2-001
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      double d = 3 / 4 + 5;
      System.out.println(d);
    answer: "5.0"
    explanation: "Zuerst `3 / 4`: zwei `int`, also Ganzzahldivision, Ergebnis 0. Dann `0 + 5` = 5, immer noch `int`. Erst beim Speichern in `d` wird daraus 5.0."
    source: "VL 2.2, Folie 7"

  - id: gdp-vl02-2-002
    type: basic
    front: "`double d = 3 / 4 + 5;` Warum hilft das `double` links nicht gegen die Ganzzahldivision rechts?"
    back: "**Java rechnet erst die rechte Seite aus. Der Typ der Variablen links ändert nichts an der Rechnung.**"
    extra: "Für 5.75 muss schon in der Rechnung ein `double` stecken, z. B. `3.0 / 4 + 5`."
    source: "VL 2.2, Folie 7"
    tags: [warum]

  - id: gdp-vl02-2-003
    type: cloze
    text: "Typ eines Ausdrucks in Java: Sind beide Werte `int`, ist das Ergebnis {{c1::`int`}}. Ist ein `double` dabei, wird der andere Wert vorher {{c2::zu `double`}}, und das Ergebnis ist `double`."
    extra: "`11 / 4` ergibt 2, `11.0 / 4` und `11 / 4.0` ergeben beide 2.75. Es ist egal, auf welcher Seite das `double` steht."
    source: "VL 2.2, Folie 8"

  - id: gdp-vl02-2-004
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      System.out.println(7 / 2 * 2.0);
    answer: "6.0"
    explanation: "`/` und `*` sind gleichrangig, Java rechnet von links nach rechts. Zuerst `7 / 2` mit zwei `int`: 3. Dann `3 * 2.0` = 6.0. Der Rest war schon verloren, bevor das `double` ins Spiel kam."
    source: "VL 2.2, Folie 8"

  - id: gdp-vl02-2-005
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      System.out.println(2.0 * 7 / 2);
    answer: "7.0"
    explanation: "Von links nach rechts: `2.0 * 7` = 14.0 ist schon ein `double`, dann `14.0 / 2` = 7.0. Gleiche Zahlen wie bei `7 / 2 * 2.0`, andere Reihenfolge, anderes Ergebnis."
    source: "VL 2.2, Folie 8"

  - id: gdp-vl02-2-006
    type: basic
    front: "Für Werte von 0 bis 100 wäre `byte` groß genug. Warum nimmt man in Java trotzdem `int`?"
    back: "**`byte` und `short` werden beim Rechnen ohnehin zu `int`. Man braucht dann Casts zum Zurückschreiben und spart bei einer Variablen fast nichts.**"
    extra: "Standard: `int` und `double`. `byte`/`short` nur, wenn Speicher wirklich zählt, etwa bei sehr großen Datenmengen."
    source: "VL 2.2, Folie 5, 8"
    tags: [warum]

  - id: gdp-vl02-2-007
    type: cloze
    text: "Typumwandlung: Von `int` nach `double` wandelt Java {{c1::automatisch}} um. Von `double` nach `int` nur mit {{c2::einem Cast wie `(int) schnitt`}}."
    extra: "Bei `int` → `double` geht nichts verloren (3 wird 3.0). Bei `double` → `int` gehen die Nachkommastellen verloren."
    source: "VL 2.2, Folie 10"

  - id: gdp-vl02-2-008
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      int ganz = (int) 2.99;
      System.out.println(ganz);
    answer: "2"
    explanation: "Der Cast `(int)` schneidet ab, er rundet nicht. Zum Runden gibt es `Math.round`."
    source: "VL 2.2, Folie 10"

  - id: gdp-vl02-2-009
    type: code
    kind: error
    prompt: "`javac` meldet zu Zeile 2: `possible lossy conversion from double to int`. Was bedeutet das?"
    code: |
      double schnitt = 2.75;
      int ganz = schnitt;
    expect: compile_error
    error_contains: "possible lossy conversion from double to int"
    answer: "**Ein `double` soll ohne Cast in einen `int`. Dabei würden Nachkommastellen verloren gehen.**"
    explanation: "Java will, dass man das bewusst entscheidet: `int ganz = (int) schnitt;`. Eclipse meldet denselben Fehler als „Type mismatch: cannot convert from double to int“."
    source: "VL 2.2, Folie 10"

  - id: gdp-vl02-2-010
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      int a = 7;
      int b = 2;
      System.out.println((double) (a / b));
    answer: "3.0"
    explanation: "Die Klammern erzwingen zuerst `a / b` mit zwei `int`: 3. Erst danach wird die 3 zu 3.0. Zu spät, der Rest ist schon weg."
    source: "VL 2.2, Folie 11"

  - id: gdp-vl02-2-011
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      int a = 7;
      int b = 2;
      System.out.println((double) a / b);
    answer: "3.5"
    explanation: "Der Cast bindet stärker als die Division und gilt nur für den Wert direkt dahinter: `a` wird 7.0, dann 7.0 / 2 = 3.5. So rettet man Durchschnitte aus `summe / anzahl`."
    source: "VL 2.2, Folie 11"

  # ---------------------------------------------------------------- Grenzen der Zahlen
  - id: gdp-vl02-2-012
    type: basic
    front: "`int jahr = 31536000;` (Sekunden pro Jahr). Was passiert bei `int hundert = jahr * 100;`, und warum ist das gefährlich?"
    back: "**Überlauf: Das Ergebnis passt nicht in einen `int` und springt ins Negative (−1141367296). Es gibt keinen Fehler und keine Warnung.**"
    extra: "Der größte `int` ist 2147483647 (`Integer.MAX_VALUE`). Wie beim Kilometerzähler kommt nach dem größten Wert der kleinste. Man merkt es nur, wenn man die erwartete Größenordnung kennt."
    source: "VL 2.2, Folie 13–14"

  - id: gdp-vl02-2-013
    type: code
    kind: fill
    prompt: "Ergänze ein Zeichen, damit die Multiplikation in `long` gerechnet wird und das richtige Ergebnis herauskommt."
    code: |
      int jahr = 60 * 60 * 24 * 365;
      long hundert = jahr * 100{{c1::L}};
      System.out.println(hundert);
    answer: "3153600000"
    explanation: "Das `L` macht aus der 100 ein `long`-Literal. Ist ein Wert `long`, rechnet Java die ganze Multiplikation in `long` (64 Bit). Alternative: `Math.multiplyExact(jahr, 100)` bricht bei Überlauf mit einem Fehler ab, statt still falsch zu rechnen."
    source: "VL 2.2, Folie 13"

  - id: gdp-vl02-2-014
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      System.out.println(0.1 * 3 == 0.3);
    answer: "false"
    explanation: "0,1 ist im Binärsystem unendlich lang (wie 1/3 im Dezimalsystem). Ein `double` speichert nur die nächste darstellbare Zahl: `0.1 * 3` ergibt 0.30000000000000004."
    source: "VL 2.2, Folie 15"

  - id: gdp-vl02-2-015
    type: basic
    front: "Wie vergleicht man zwei `double`-Werte `x` und `y` richtig auf Gleichheit?"
    back: "**Über einen kleinen Abstand: `Math.abs(x - y) < eps`, nie mit `==`.**"
    extra: "`Math.abs` liefert den Betrag der Differenz. Zum Beispiel eps = 1e-9, ein Milliardstel: Ist der Abstand kleiner, gelten die Werte als gleich."
    source: "VL 2.2, Folie 15"

  - id: gdp-vl02-2-016
    type: basic
    front: "Hotel ohne Klassen: `gast1Name`, `gast1Jahr`, `gast2Name`, `gast2Jahr` … Was ist dabei das eigentliche Problem, außer der Menge an Variablen?"
    back: "**Nichts sagt Java, dass `gast1Name` und `gast1Jahr` zusammengehören.** Das steht nur im Namen."
    extra: "Ein Tippfehler wie `gast2Jahr` statt `gast1Jahr` fällt niemandem auf. Lösung: Was zusammengehört, wird ein eigener Typ, eine Klasse."
    source: "VL 2.2, Folie 18"
    tags: [warum]

  - id: gdp-vl02-2-017
    type: cloze
    text: "`public class Gast { String name; int geburtsjahr; boolean stammgast; }` definiert einen {{c1::neuen Typ}}. `Gast ada;` ist danach eine gültige Deklaration, genau wie `int alter;`."
    extra: "Die Variablen in einer Klasse heißen Attribute. Die Klasse steht in einer eigenen Datei `Gast.java`."
    source: "VL 2.2, Folie 19"

  - id: gdp-vl02-2-018
    type: code
    kind: predict
    prompt: "Die Klasse `Gast` hat keinen eigenen Konstruktor. Was gibt dieses Programm aus?"
    code: |
      Gast ben = new Gast();
      System.out.println(ben.name);
      System.out.println(ben.geburtsjahr);
      System.out.println(ben.stammgast);
    support: |
      class Gast { String name; int geburtsjahr; boolean stammgast; }
    answer: |
      null
      0
      false
    explanation: "Attribute bekommen automatisch Default-Werte: Zahlen 0 bzw. 0.0, `boolean` `false`, alle Objekttypen (auch `String`) `null`."
    source: "VL 2.2, Folie 22"

  - id: gdp-vl02-2-019
    type: basic
    front: "`ben.name` ist `null`. Was bedeutet `null`, und was passiert bei `ben.name.length()`?"
    back: "**`null` heißt: Die Variable zeigt auf kein Objekt. `ben.name.length()` stürzt mit einer `NullPointerException` ab.**"
    extra: "`null` ist nicht der Text „null“, auch wenn `println` es so ausgibt."
    source: "VL 2.2, Folie 22"

  - id: gdp-vl02-2-020
    type: basic
    front: "Attribute bekommen Default-Werte. Warum meldet `int gaeste; System.out.println(gaeste);` in `main` trotzdem einen Fehler?"
    back: "**Nur Attribute bekommen Default-Werte, lokale Variablen in einer Methode nicht.**"
    extra: "Die Meldung lautet „may not have been initialized“ (Eclipse) bzw. „might not have been initialized“ (javac)."
    source: "VL 2.2, Folie 22"

  - id: gdp-vl02-2-021
    type: cloze
    text: "Ein Konstruktor in Java heißt {{c1::genau wie die Klasse}} und hat {{c2::keinen Rückgabetyp, auch nicht `void`}}."
    extra: "Beispiel: `public Gast(String name, int geburtsjahr) { this.name = name; this.geburtsjahr = geburtsjahr; }`. Attribute, die er nicht setzt, behalten ihren Default-Wert."
    source: "VL 2.2, Folie 23"

  - id: gdp-vl02-2-022
    type: basic
    front: "Im Konstruktor `Gast(String name, …)` steht `this.name = name;`. Was ist `this.name`, und was ist `name`?"
    back: "**`this.name` ist das Attribut des Objekts, das gerade gebaut wird. `name` allein ist der Parameter.**"
    extra: "Die Zeile kopiert den Parameter in das Attribut. Empfehlung: Attribute immer mit `this` schreiben, dann sieht man sofort, was Attribut und was Parameter ist."
    source: "VL 2.2, Folie 23"

  - id: gdp-vl02-2-023
    type: code
    kind: bug
    prompt: "`Gast` hat nur den Konstruktor `Gast(String name, int geburtsjahr)`. Warum kompiliert Zeile 1 nicht?"
    code: |
      Gast g = new Gast();
      g.name = "Ada Brandt";
    expect: compile_error
    answer: "**Sobald es einen Konstruktor mit Parametern gibt, gibt es `new Gast()` nicht mehr automatisch.**"
    explanation: "Wer beides will, schreibt zusätzlich einen leeren Konstruktor. Ebenso kompiliert `new Gast(1998, \"Ada\")` nicht: Die Argumente werden der Reihe nach den Parametern zugeordnet."
    source: "VL 2.2, Folie 23–24"

  - id: gdp-vl02-2-024
    type: code
    kind: bug
    prompt: "Das Programm kompiliert und läuft, gibt aber `null` statt „Ada“ aus. Welche Zeile ist falsch, und warum?"
    code: |
      public class Gast {
          String name;

          public Gast(String name) {
              name = name;
          }

          public static void main(String[] args) {
              Gast g = new Gast("Ada");
              System.out.println(g.name);
          }
      }
    support: ""
    expect: wrong_output
    wrong_output: "null"
    answer: "**Zeile 5: `name = name;` weist den Parameter sich selbst zu.** Richtig: `this.name = name;`."
    explanation: "Im Konstruktor verdeckt der Parameter `name` das gleichnamige Attribut. Das Attribut bleibt auf `null`. `javac` sagt dazu nichts. Eclipse markiert die Zeile nur gelb: „The assignment to variable name has no effect“."
    source: "VL 2.2, Folie 25"

  - id: gdp-vl02-2-025
    type: cloze
    text: "`new Gast(\"Ada Brandt\", 1998)` läuft in drei Schritten: {{c1::Speicher}} (ein Objekt mit Default-Werten anlegen), {{c2::Konstruktor}} (Attribute aus den Argumenten setzen), {{c3::Referenz}} (die Variable verweist auf das fertige Objekt)."
    source: "VL 2.2, Folie 24"

  # ---------------------------------------------------------------- Referenzen
  - id: gdp-vl02-2-026
    type: basic
    front: "`int jahr = 1998;` `Gast ada = new Gast(\"Ada Brandt\", 1998);` `Gast auchAda = ada;` Was steht in `jahr`, was in `ada`, und was kopiert die dritte Zeile?"
    back: "**In `jahr` steht die Zahl selbst, in `ada` nur ein Verweis auf das Objekt. Zeile 3 kopiert den Verweis, nicht das Objekt: Es gibt nur eine Ada.**"
    figure_back: "gdp-vl02-2-026.png"
    source: "VL 2.2, Folie 27"

  - id: gdp-vl02-2-027
    type: cloze
    text: "`int`, `double`, `boolean`, `char` heißen {{c1::primitive Typen}}: Ihr Wert steht direkt in der Variablen. Alle Klassen, auch `String`, heißen {{c2::Referenztypen}}: In der Variablen steht ein Verweis."
    source: "VL 2.2, Folie 27"

  - id: gdp-vl02-2-028
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      Gast a = new Gast("Ada", 1998);
      Gast b = a;
      b.name = "Ben";
      System.out.println(a.name);
    answer: "Ben"
    explanation: "`b = a` kopiert nur den Verweis. `a` und `b` zeigen auf dasselbe Objekt; die Änderung über `b` sieht man über `a`. Bei `int x = 5; int y = x; x = 7;` bleibt `y` dagegen 5: Dort steht der Wert selbst in der Variablen."
    source: "VL 2.2, Folie 4, 28"

  - id: gdp-vl02-2-029
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      String vorname = "Ada";
      String name = vorname + " Brandt";
      System.out.println(name == "Ada Brandt");
      System.out.println(name.equals("Ada Brandt"));
    answer: |
      false
      true
    explanation: "`==` prüft bei Objekten, ob es dasselbe Objekt ist. `name` ist neu zusammengebaut, das Literal ist ein anderes Objekt. `equals` prüft, ob derselbe Text drinsteht. Texte immer mit `equals` vergleichen."
    source: "VL 2.2, Folie 29"

  - id: gdp-vl02-2-030
    type: code
    kind: bug
    prompt: "`Buchung` hat die Attribute `Gast gast` und `int naechte`. Warum stürzt Zeile 3 ab?"
    code: |
      Buchung b = new Buchung();
      b.naechte = 3;
      System.out.println(b.gast.name);
    support: |
      class Gast { String name; int geburtsjahr; boolean stammgast; }
      class Buchung { Gast gast; int naechte; }
    expect: runtime_error
    error_contains: "NullPointerException"
    answer: "**`b.gast` wurde nie gesetzt und ist `null`. Von `null` kann man keinen `name` lesen: `NullPointerException`.**"
    explanation: "Es fehlt z. B. `b.gast = new Gast(\"Ada Brandt\", 1998);`. Die Kette `b.gast.name` liest man von links: Buchung → ihr Gast → dessen Name."
    source: "VL 2.2, Folie 30"

  # ---------------------------------------------------------------- Ergänzt beim Faktencheck (Folien 9, 16, 20, 21)
  - id: gdp-vl02-2-031
    type: code
    kind: predict
    prompt: "Was gibt dieses Programm aus?"
    code: |
      double d = 10 / 4 + 7 / 2.0;
      System.out.println(d);
    answer: "5.5"
    explanation: "Jede Division entscheidet für sich. `10 / 4` sind zwei `int`: 2. `7 / 2.0` hat ein `double`: 3.5. Die Summe ist 5.5. Wer 6.0 erwartet, rechnet beide Divisionen mit Kommazahlen."
    source: "VL 2.2, Folie 9"

  - id: gdp-vl02-2-032
    type: cloze
    text: "Geldbeträge exakt speichern: als ganze {{c1::Cent}} in einem `int` oder `long`, oder mit der Bibliotheksklasse {{c2::`BigDecimal`}}."
    extra: "`double` ist für die meisten Zwecke genau genug, aber kleine Fehler können sich aufsummieren. Bei ganzen Cent muss man auf den Wertebereich achten (Überlauf)."
    source: "VL 2.2, Folie 16"

  - id: gdp-vl02-2-033
    type: code
    kind: fill
    prompt: "Ergänze Zeile 1 so, dass ein neues Gast-Objekt entsteht."
    code: |
      Gast ada = {{c1::new Gast()}};
      ada.name = "Ada Brandt";
      ada.geburtsjahr = 1998;
      System.out.println(ada.name + ", " + ada.geburtsjahr);
    support: |
      class Gast { String name; int geburtsjahr; boolean stammgast; }
    answer: "Ada Brandt, 1998"
    explanation: "`new Gast()` baut ein neues Objekt. Mit dem Punkt liest und setzt man seine Attribute: `ada.name` ist der Name von `ada`. Hier hat `Gast` noch keinen eigenen Konstruktor."
    source: "VL 2.2, Folie 20"

  - id: gdp-vl02-2-034
    type: cloze
    text: "Ein Objekt heißt auch {{c1::Instanz}} einer Klasse. Jedes Objekt hat {{c2::eigene Werte}} in seinen Attributen: Ändert man `ada`, bleibt `ben`, wie er ist."
    extra: "Klasse = Bauplan, Objekt = ein konkreter Gast nach diesem Plan."
    source: "VL 2.2, Folie 21"
