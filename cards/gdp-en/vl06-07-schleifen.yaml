# English translation overlay for cards/gdp/vl06-07-schleifen.yaml.
# Only text fields; code, run, answers of predict cards and figures come from the German file.
# Identifiers in code stay German, exactly as on the slides (Zimmer, plaetze, preise, ...).
lecture:
  deck: "L06–07 Loops"
  header: "GdP · L6–7 Loops"
cards:
  - id: gdp-vl06-07-001
    text: "In `for (int i = 0; i < 3; i++)` the start `int i = 0` runs {{c1::once, at the very beginning}}. The condition `i < 3` is checked {{c2::before every iteration}}, the step `i++` runs {{c3::after every iteration}}."
    extra: "Read aloud: \"Set i to 0. As long as i < 3 holds: run the body, then increase i by 1.\" If the condition is false, execution continues after the closing brace."
    source: "L6–7, slide 6"
  - id: gdp-vl06-07-002
    front: "Loop `for (int i = 1; i <= 3; i++)`: what value does `i` have when the condition is checked for the last time?"
    back: "**4.** The body runs for 1, 2 and 3; only at `i = 4` is `i <= 3` false."
    extra: "In the trace table this is the last row: \"4, false: end\". This row is easy to overlook."
    source: "L6–7, slide 7"
  - id: gdp-vl06-07-003
    text: "A trace table has {{c1::one column per variable}} (plus one for the condition) and {{c2::one row per iteration}}."
    extra: "The start values go at the very top. With pen and paper you play the computer and predict the output."
    source: "L6–7, slide 7"
  - id: gdp-vl06-07-004
    prompt: "What does this program print?"
    explanation: "0, 3, 6 and 9 are all less than 10. Then `i` becomes 12 and the condition is false. The start value 0 is printed before the first step."
    source: "L6–7, slide 8"
  - id: gdp-vl06-07-005
    prompt: "The loop should count in steps of ten. Why does it not compile?"
    answer: "**`i + 10` only computes a value and does not change `i`.** As a statement, that is not valid Java."
    explanation: "Correct is `i += 10` or `i = i + 10`. In the same way there are `i -= 10` and `i *= 2`."
    source: "L6–7, slide 9"
  - id: gdp-vl06-07-006
    text: "For an `ArrayList` you write {{c1::`liste.size()`}} and {{c2::`liste.get(i)`}}, for an array {{c3::`a.length`}} and `a[i]`."
    extra: "For both, the index starts at 0. That is why the condition is `i < liste.size()`, not `<=`."
    source: "L6–7, slide 10"
  - id: gdp-vl06-07-007
    front: "In Java, when do you use the for loop with an index instead of the for-each loop `for (Zimmer z : liste)` (*Zimmer* = room)?"
    back: "**When you need the position or want to run backwards.**"
    extra: "for-each reads every element exactly once, without an index. No index also means fewer mistakes. The type before the colon must match the type of the elements."
    source: "L6–7, slide 11"
  - id: gdp-vl06-07-008
    prompt: "The program prints 12 and 7 and then stops with a `NullPointerException`. What is the cause?"
    answer: "**Slot 2 is empty, it holds `null`.** You cannot read an attribute of `null`."
    explanation: "The message even names the expression that was `null` (`plaetze[i]`, *plaetze* = slots) and the field (`nummer`). Read the message first."
    source: "L6–7, slide 12"
  - id: gdp-vl06-07-009
    prompt: "Complete the condition so that the array with a gap is traversed without a crash."
    explanation: "Check first, then access: `null` means no object. This also applies in for-each: there, too, `null` comes along as an element."
    source: "L6–7, slide 18"
  - id: gdp-vl06-07-010
    front: "Why do you always write curly braces after `if`, even when only one line follows?"
    back: "**Without braces only the next line belongs to the `if`.** A second line added later then always runs."
    extra: "That gives a bug you can hardly see. `if` is a branch, not an \"if loop\". It does not repeat anything."
    source: "L6–7, slides 13–14"
  - id: gdp-vl06-07-011
    text: "For `a && b`, {{c1::both sides}} must be true; for `a || b`, {{c2::at least one side}} is enough."
    extra: "With `frei = 3` (*frei* = free), `preis = 89.0`: `frei > 0 && preis < 100` is true, `frei == 0 || preis < 50` is false. `!` flips the result. Use parentheses when combining."
    source: "L6–7, slide 15"
  - id: gdp-vl06-07-012
    prompt: "What does this program print?"
    explanation: "Java checks from top to bottom and stops after the first match. `7 >= 3` is already true (*naechte* = nights, *Rabatt* = discount). That is why `>= 7` must come first."
    source: "L6–7, slide 16"
  - id: gdp-vl06-07-013
    prompt: "What does this program print?"
    explanation: "The `break` is missing after `case \"Buffet\"`. Java runs on into the next `case`, up to the first `break`. This is called fall-through."
    source: "L6–7, slide 19"
  - id: gdp-vl06-07-014
    front: "Which mistake of the classic switch form with `case …:` does the arrow notation (`case \"Buffet\" -> \"Standard-Buffet\";`) prevent?"
    back: "**Fall-through caused by a forgotten `break`:** with the arrow, each case stands on its own."
    extra: "In addition, the switch expression returns a value directly: `String text = switch (art) { … };` (since Java 14)."
    source: "L6–7, slide 19"
  - id: gdp-vl06-07-015
    front: "`\"Ada\" == \"Ada\"` gives `true` in Java. Why do you still always compare strings with `equals`?"
    back: "**Java shares identical literals, but you must not rely on that. Text from input or a file is usually a new object, and then `==` gives false.**"
    extra: "AI code with `==` for strings compiles and looks plausible. `equals` is case-sensitive; `equalsIgnoreCase` is not."
    source: "L6–7, slide 20"
  - id: gdp-vl06-07-016
    prompt: "What does this program print?"
    explanation: "`guenstig` (cheap) counts only inside the `if` (64.5 and 77.0), `summe` (sum) gets every price: 350.5 / 4 = 87.625. (*unter 80 Euro* = under 80 euros, *Schnitt* = average.)"
    source: "L6–7, slide 23"
  - id: gdp-vl06-07-017
    text: "Counting and summing: the start value goes {{c1::before the loop}}, the update {{c2::inside the loop}}, and the result (e.g. the average) comes {{c3::after the loop}}."
    extra: "If you write `summe = 0` inside the loop, you reset the sum every time."
    source: "L6–7, slide 23"
  - id: gdp-vl06-07-018
    prompt: "The program should print the cheapest price, but prints `0.0`. Which line is wrong, and why?"
    answer: "**Line 2: `min` starts at 0.** No price is less than 0, so the `if` is never true."
    explanation: "Correct is `double min = preise[0];`. Then the loop can start at `i = 1`. For the maximum you just flip the comparison."
    source: "L6–7, slides 24, 36–37"
  - id: gdp-vl06-07-019
    prompt: "`finde(liste, 7)` (*finde* = find) returns `null`, although room 7 is second in the list. Why?"
    answer: "**`return null` in the `else` ends the method already at the first room (12).**"
    explanation: "`return null` belongs after the loop: only when all rooms have been checked is it certain that none matches."
    source: "L6–7, slide 26"
  - id: gdp-vl06-07-020
    front: "A method `finde` returns a `Zimmer` (room) or `null`. What must the caller do before reading `z.preisProNacht` (price per night)?"
    back: "**Check whether `z == null`.**"
    extra: "Without this check, accessing the attribute gives a `NullPointerException`, e.g. with `finde(liste, 99)` if there is no room 99."
    source: "L6–7, slide 26"
  - id: gdp-vl06-07-021
    text: "Roles of variables: a variable that is 0 before the loop and gets `+=` inside the loop (e.g. `summe`) is a {{c1::gatherer}}."
    extra: "A counter like `guenstig` is also a gatherer: it gets +1 when the condition holds. Roles after Sajaniemi."
    source: "L6–7, slides 23, 27"
  - id: gdp-vl06-07-022
    front: "What role does the variable `gefunden` (found) have in linear search, and how do you recognise it?"
    back: "**Flag:** it remembers whether something has happened. It becomes `true` once and then stays that way."
    extra: "Other roles: stepper (`i`), gatherer (`summe`), best so far (`min`), fixed value (`preise`)."
    source: "L6–7, slides 25, 27"
  - id: gdp-vl06-07-023
    front: "Roles of variables in loops: which role belongs in the marked cell? (slide in German)"
    back: "**Best so far** (German: \"Bester bisher\")"
    extra: "`min` remembers the best value the loop has seen so far."
    source: "L6–7, slide 27"
  - id: gdp-vl06-07-024
    prompt: "What does this program print?"
    explanation: "`i` is 1, 2, 4, 8, then 16: end. Four iterations. \"From 1 to 10\" sounds like ten, but the step doubles."
    source: "L6–7, slide 28"
  - id: gdp-vl06-07-025
    prompt: "What does this program print?"
    explanation: "The inner loop runs completely for every `i`, and `j` starts at 1 again each time. `print` writes without a line break, `println()` ends the line."
    source: "L6–7, slide 29"
  - id: gdp-vl06-07-026
    front: "In Java, when do you use a `while` loop instead of a `for` loop?"
    back: "**When the end depends on the data and the number of iterations is not known in advance.**"
    extra: "Example: how many years until 1000 euros double at 5 % interest? `while (betrag < 2000)` (*betrag* = amount) → 15 years. Every for loop can also be written as a while loop."
    source: "L6–7, slide 31"
  - id: gdp-vl06-07-027
    text: "`do { … } while (bedingung);` checks the condition {{c1::after every iteration}} and therefore runs {{c2::at least once}}."
    extra: "`while` checks before every iteration and can also run zero times. Typical for do-while: input, first ask, then check."
    source: "L6–7, slide 32"
  - id: gdp-vl06-07-028
    prompt: "What does this program print?"
    explanation: "The condition is not watched all the time; it is only checked at the start of each iteration. The body always runs to the end. (*noch drin* = still inside.)"
    source: "L6–7, slide 33"
  - id: gdp-vl06-07-029
    prompt: "Expected: 1 + 2 + … + 100 = 5050. The program prints 4950. What is wrong?"
    answer: "**`i < 100` leaves out the 100 (off-by-one).** Correct is `i <= 100`."
    explanation: "Starting at 0 does no harm here, adding 0 changes nothing. Three questions for every loop: first value? last value? Is the boundary included?"
    source: "L6–7, slide 34"
  - id: gdp-vl06-07-030
    front: "`for (int n = 1; n != 12; n += 2)` should print the odd numbers up to 12. Why does the loop never stop?"
    back: "**`n` is always odd (1, 3, 5, …) and never becomes 12; `n != 12` stays true forever.**"
    extra: "Safer is `n < 12`. Ask: what changes in every iteration, and does it surely reach the condition? Emergency brake in Eclipse: the red square (Terminate)."
    source: "L6–7, slide 35"
  - id: gdp-vl06-07-031
    text: "Debugging in four steps: {{c1::guess}} (trace table), {{c2::stop}} (breakpoint), {{c3::observe}} (step by step), {{c4::compare}} (where does a value differ?)."
    extra: "The debugger shows what is. The trace table says what should be. The bug is where the two differ."
    source: "L6–7, slide 37"
  - id: gdp-vl06-07-032
    prompt: "An AI is asked to count the free rooms. The code compiles. Which two bugs are in line 2?"
    answer: "**Starting at 1 skips slot 0, and `<=` runs past the end (`ArrayIndexOutOfBoundsException`).**"
    explanation: "The third bug: the check for `null` is missing; with an array with gaps you get a `NullPointerException`. Checklist: first and last index, empty slots, first a small example by hand."
    source: "L6–7, slide 38"
